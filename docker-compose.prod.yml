services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env
    command: sh -c "composer install --no-dev -o && php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000"
    ports:
      - "127.0.0.1:9003:8000"
    depends_on:
      - db

  db:
    image: mysql:8.0
    env_file: .env
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: